      <feTurbulence type="fractalNoise" baseFrequency="0.04 0.008" numOctaves="5" result="noise" />
      <feColorMatrix type="matrix" values="
        0 0 0 0 0.82
        0 0 0 0 0.77
        0 0 0 0 0.69
        0 0 0 0.45 0" result="coloredNoise" />
