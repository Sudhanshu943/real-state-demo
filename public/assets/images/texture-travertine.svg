      <stop offset="50%" stop-color="#D4CBBB"/>
      <stop offset="75%" stop-color="#DFD8C9"/>
      <stop offset="100%" stop-color="#E8E2D4"/>
    </linearGradient>
  </defs>

  <!-- Base Travertine Bed -->
  <rect width="800" height="600" fill="url(#travBase)"/>
